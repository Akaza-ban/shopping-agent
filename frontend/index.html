<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Shopping AI - Trợ lý Mua sắm & Rà soát Thông minh</title>
    <meta name="description" content="Hệ thống trợ lý mua sắm AI thông minh: Tra cứu & đối chiếu sản phẩm, rà soát rủi ro đánh giá, làm rõ nhu cầu tương tác và lập hồ sơ mua hàng tối ưu." />
    <meta property="og:title" content="Shopping AI - AI Shopping Assistant Agent" />
    <meta property="og:description" content="Hệ thống trợ lý mua sắm AI thông minh: Tra cứu & đối chiếu sản phẩm, rà soát rủi ro đánh giá, làm rõ nhu cầu tương tác và lập hồ sơ mua hàng tối ưu." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
    <script>
      // Áp giao diện + ngôn ngữ trước khi React render để không bị nháy màu khi tải trang
      // (cùng quy tắc với hooks/usePreferences.tsx: sáng / tối / tự động theo giờ, mặc định tự động 18:00–06:00)
      try {
        var prefs = JSON.parse(localStorage.getItem('shopping-ai.preferences') || 'null');
        var legacy = JSON.parse(localStorage.getItem('shopping-ai.theme') || 'null');
        var mode = prefs && prefs.themeMode ? prefs.themeMode : legacy ? (legacy === 'dark' ? 'dark' : 'light') : 'auto';
        var dark = mode === 'dark';
        if (mode === 'auto') {
          var toMin = function (s) { var p = String(s).split(':'); return (+p[0] || 0) * 60 + (+p[1] || 0); };
          var from = toMin((prefs && prefs.darkFrom) || '18:00');
          var to = toMin((prefs && prefs.darkTo) || '06:00');
          var d = new Date();
          var now = d.getHours() * 60 + d.getMinutes();
          dark = from === to ? false : from < to ? now >= from && now < to : now >= from || now < to;
        }
        if (dark) document.documentElement.classList.add('dark');
        if (prefs && prefs.language) document.documentElement.lang = prefs.language;
      } catch (e) {}
    </script>
  </head>
  <body class="bg-canvas text-stone-900 antialiased selection:bg-amber-100 selection:text-amber-900">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
